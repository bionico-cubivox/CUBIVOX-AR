<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Leão Guerreiro | CUBIVOX AR</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#0d1220;color:#fff;font-family:Arial,sans-serif}
    header{padding:18px 22px;background:#111a2b;font-weight:700}
    main{height:calc(100vh - 60px)}
    model-viewer{width:100%;height:100%;background:radial-gradient(circle,#263a60,#0d1220)}
    .ar-button{background:#fff;border:0;border-radius:999px;padding:13px 22px;font-weight:700;position:absolute;left:50%;bottom:24px;transform:translateX(-50%);cursor:pointer}
  </style>
</head>
<body>
<header>CUBIVOX AR — Leão Guerreiro</header>
<main>
<model-viewer
  src="model.glb"
  ios-src="model.usdz"
  alt="Leão Guerreiro"
  camera-controls
  auto-rotate
  shadow-intensity="1"
  ar
  ar-modes="webxr scene-viewer quick-look">
  <button slot="ar-button" class="ar-button">VER NO MEU ESPAÇO</button>
</model-viewer>
</main>
</body>
</html>
